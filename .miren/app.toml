name = "portal-coordinator"

[services.web]
command = "/bin/app coordinator --listen 0.0.0.0:$PORT --config /miren/data/local/portal/coordinator.json"

[services.web.concurrency]
mode = "fixed"
num_instances = 1

[[services.web.disks]]
name = "coordinator-config"
provider = "local"
mount_path = "/miren/data/local"
