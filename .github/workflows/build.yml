name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build portal
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -trimpath -o "dist/portal-linux-${GOARCH}" ./cmd/portal
      - uses: actions/upload-artifact@v4
        with:
          name: portal-linux-${{ matrix.arch }}
          path: dist/portal-linux-${{ matrix.arch }}
          if-no-files-found: error
